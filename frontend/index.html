<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg class="ic"><use href="#i-file"/></svg></span>
      <span class="brand-name">DocIntel</span>
    </div>
    <nav>
      <ul class="nav" id="nav">
        <li><a href="#/dashboard" data-nav="dashboard"><svg class="ic" aria-hidden="true"><use href="#i-dashboard"/></svg>Dashboard</a></li>
        <li><a href="#/documents" data-nav="documents"><svg class="ic" aria-hidden="true"><use href="#i-file"/></svg>Documents</a></li>
        <li><a href="#/review" data-nav="review"><svg class="ic" aria-hidden="true"><use href="#i-review"/></svg>Review queue<span class="nav-count" id="reviewCount" hidden></span></a></li>
        <li><a href="#/anomalies" data-nav="anomalies"><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>Anomalies</a></li>
        <li><a href="#/search" data-nav="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>Search</a></li>
        <li><a href="#/compare" data-nav="compare"><svg class="ic" aria-hidden="true"><use href="#i-compare"/></svg>Compare</a></li>
        <li><a href="#/audit" data-nav="audit"><svg class="ic" aria-hidden="true"><use href="#i-audit"/></svg>Audit log</a></li>
        <li><a href="#/settings" data-nav="settings"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg>Settings</a></li>
      </ul>
    </nav>
    <div class="sidebar-foot" id="modeBox"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="workspace">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="crumbs" id="crumbs"></div>
      <button class="btn primary" id="uploadOpen" type="button"><svg class="ic" aria-hidden="true"><use href="#i-upload"/></svg><span>Upload document</span></button>
    </header>
    <main id="view" tabindex="-1" aria-live="polite" aria-busy="true"></main>
  </div>
</div>

<dialog id="uploadDialog" aria-labelledby="uploadTitle">
  <form method="dialog" class="dialog-head">
    <h2 id="uploadTitle">Upload a document</h2>
    <button class="icon-btn" value="close" aria-label="Close"><svg class="ic"><use href="#i-close"/></svg></button>
  </form>
  <div id="uploadBody"></div>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="assets/app.js"></script>
</body>
</html>
